<aside class="theme-panel" [class.open]="open">
  <div class="panel-header">
    <div class="panel-title">Theme Settings</div>
    <button mat-icon-button type="button" aria-label="Close theme panel" (click)="closePanel.emit()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="section">
    <div class="label">Theme</div>
    <div class="swatches">
      @for (theme of themes; track theme) {
        <button
          type="button"
          class="swatch"
          [class.active]="selectedTheme() === theme"
          [attr.data-theme]="theme"
          (click)="setTheme(theme)">
          {{ theme }}
        </button>
      }
    </div>
  </div>

  <div class="section">
    <div class="label">Shell Mode</div>
    <mat-slide-toggle [checked]="darkMode()" (change)="setDarkMode($event.checked)">
      Dark mode
    </mat-slide-toggle>
  </div>
</aside>
